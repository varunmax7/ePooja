name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Verify
        run: pnpm verify

      - name: Panchangam fixture audit (informational)
        # Reports how far the verified fixture set is from the §9.1 bar of 60.
        # Non-blocking: the debt is tracked in content/REVIEW_QUEUE.md, and a
        # red X here would say nothing new on every PR until it closes.
        continue-on-error: true
        run: pnpm fixtures:audit

  expo-checks:
    name: expo config + doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve app config
        run: pnpm --filter @epooja/mobile exec expo config --type public

      - name: Expo doctor
        run: pnpm --filter @epooja/mobile exec expo-doctor

      - name: Bundle check (Metro export)
        run: pnpm --filter @epooja/mobile exec expo export --platform ios --output-dir /tmp/epooja-export
